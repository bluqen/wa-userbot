services:
  - type: web
    name: wa-bot-web
    runtime: node
    plan: free
    region: oregon
    rootDir: web
    buildCommand: npm install && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false # same Aiven connection string as web/.env today
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        sync: false # this service's own https://...onrender.com URL
      - key: GATEWAY_URL
        sync: false # wa-bot-gateway's https://...onrender.com URL
      - key: INTERNAL_API_SECRET
        sync: false # must exactly match the value entered for wa-bot-plugins
      - key: ADMIN_EMAILS
        sync: false # comma-separated allowlist, e.g. your own email
