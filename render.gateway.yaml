services:
  - type: web
    name: wa-bot-gateway
    runtime: node
    plan: free
    region: oregon
    rootDir: gateway
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # Baileys 7 requires Node >= 20 and enforces it via a preinstall
      # check, which fails the build outright on anything older. Pinned
      # explicitly rather than relying on package.json's ">=20" range,
      # which isn't a version Render can resolve directly.
      - key: NODE_VERSION
        value: "20"
      - key: PLUGIN_ENGINE_URL
        sync: false # paste wa-bot-plugins' https://...onrender.com URL after it's deployed
      - key: DATABASE_URL
        sync: false # same Aiven connection string as gateway/.env today
      - key: PUBLIC_URL
        sync: false # this service's own https://...onrender.com URL -- must match GATEWAY_URL on wa-bot-web exactly
      - key: WEB_APP_URL
        sync: false # paste wa-bot-web's https://...onrender.com URL
      - key: INTERNAL_API_SECRET
        sync: false # must exactly match the value entered for wa-bot-web and wa-bot-plugins
